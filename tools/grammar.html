<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale stops iOS Safari from zooming in when the topic select gets focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title data-t="grammar_title">Klucz</title>
    <link rel="icon" href="__ICON__" />
    <!-- Before the first paint, so a stored theme does not flash. -->
    <script>
      try {
        document.documentElement.style.colorScheme = localStorage.getItem("klucz-theme") ?? "";
      } catch {}
    </script>
    <style>
      __BASE__
    </style>
    <style media="screen">
      /* The reading page's two rows: the topics up to the way back, which is where the grammar button
         is there, and below share, theme, fullscreen and language, from the share button's column on;
         below it one grammar sheet. */
      .switcher {
        grid-column: span 7;
      }
      .share {
        grid-column: 3;
      }
      @media (min-width: 641px) {
        .switcher {
          grid-column: span 6;
        }
        #back {
          grid-column: span 2;
        }
      }
      /* The sheets' print style (grammar/style.css) in the reading page's look, with the same
         selectors, so each sheet's own <style> overrides it as it does on paper. */
      @scope (.page) {
        * {
          margin: 0;
          padding: 0;
        }
        :scope {
          overflow-x: auto;
          line-height: 1.45;
        }
        /* the title as a chapter's on the reading page */
        h1 {
          font-family: var(--read);
          font-size: 34px;
          line-height: 1.15;
          letter-spacing: -0.3px;
          text-wrap: balance;
        }
        h1 small {
          display: block;
          font-family: var(--ui);
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: var(--accent);
          margin-bottom: 10px;
        }
        .sub {
          font-size: 17px;
          margin-top: 8px;
        }
        h2 {
          margin-top: 32px;
          font-size: 20px;
          letter-spacing: -0.2px;
        }
        :is(h2, h3) span {
          font-weight: normal;
          color: var(--text-2);
        }
        .rule {
          margin-top: 4px;
        }

        table {
          width: 100%;
          margin-top: 8px;
          border-collapse: collapse;
          table-layout: fixed;
          font-size: 16px;
        }
        th {
          font-size: 14px;
          font-weight: 600;
          text-align: left;
          vertical-align: bottom;
          padding: 4px 10px;
          border-bottom: 2px solid var(--text);
        }
        th small {
          display: block;
          font-size: 13px;
          font-weight: normal;
          color: var(--text-2);
        }
        td {
          padding: 4px 10px;
          border-bottom: 1px solid var(--line);
          color: var(--text-2);
        }
        th:first-child,
        td:first-child {
          width: 150px;
        }
        td:first-child {
          font-style: italic;
          color: var(--text);
        }
        b {
          color: var(--text);
        }
        .stem {
          color: var(--text-2);
        }

        .cols {
          display: flex;
          gap: 24px;
          margin-top: 8px;
        }
        .col {
          flex: 1;
          min-width: 0;
        }
        .col h3 {
          font-size: 14px;
          font-weight: 600;
          padding: 4px 0;
          border-bottom: 2px solid var(--text);
        }
        .col p {
          font-size: 16px;
          padding: 4px 0;
          border-bottom: 1px solid var(--line);
          color: var(--text-2);
        }

        .box {
          margin-top: 32px;
          padding: 14px 18px;
          background: var(--surface);
          border: 1px solid var(--line); /* not a shadow: the page's overflow would clip it */
          border-radius: 16px;
          font-size: 16px;
        }
        .box h3 {
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 6px;
        }
        .box table {
          margin-top: 0;
          table-layout: auto;
          font-size: inherit;
        }
        .box td {
          padding: 3px 24px 3px 0;
          border: 0;
          color: var(--text);
          font-style: normal;
        }
        .box td:first-child {
          width: auto;
        }
        .ex td:last-child {
          font-style: italic;
        }
        .note {
          margin-top: 8px;
        }

        /* the sheets' column widths are made for A4; on a phone the columns fit their content */
        @media (max-width: 640px) {
          table {
            table-layout: auto;
          }
          :is(th, td) {
            width: auto !important;
          }
          .cols {
            flex-direction: column;
            gap: 0;
          }
        }
        @media (max-width: 480px) {
          h1 {
            font-size: 28px;
          }
        }
      }
    </style>
    <!-- On paper: the open sheet alone, styled by grammar/style.css as in the PDFs. -->
    <style media="print">
      __PRINT__
    </style>
    <style media="print">
      body::before,
      .bar,
      .top-line {
        display: none;
      }
      main {
        padding: 0;
      }
      .column {
        max-width: none;
      }
      .page h1 small {
        display: none;
      }
      .page {
        zoom: var(--fit, 1);
      }
      /* each sheet's own style uses the page's colors; on paper they are its print colors again */
      :root {
        color-scheme: light !important; /* over a stored theme's inline style */
        --text: #000;
        --text-2: #8c8c8c;
        --line: #bbb;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <div class="switcher">
          <button class="arrow" id="prev" data-tip="prev_topic">
            <span class="icon" aria-hidden="true">chevron_left</span>
          </button>
          <select id="topic" data-tip="choose_topic"></select>
          <button class="arrow" id="next" data-tip="next_topic">
            <span class="icon" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <a class="tool" id="back" href="index.html" data-tip="back">
          <span class="icon" aria-hidden="true">menu_book</span
          ><span class="label" data-t="book"></span>
        </a>
        <div class="share">
          <button class="tool" id="share" data-tip="share" aria-expanded="false">
            <span class="icon" aria-hidden="true">ios_share</span>
          </button>
          <div class="share-menu" id="share-menu" hidden></div>
        </div>
        <button class="tool" id="theme">
          <span class="icon" aria-hidden="true">dark_mode</span>
        </button>
        <button class="tool" id="fullscreen">
          <span class="icon" aria-hidden="true">fullscreen</span>
        </button>
        <label class="tool lang">
          <span class="icon" aria-hidden="true">language</span>
          <select id="lang" data-tip="language">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </label>
      </div>
      <div class="toast" id="toast" hidden role="status"></div>
    </header>

    <main>
      <div class="column">
        <p class="top-line" data-t="proverb"></p>
        __SHEETS__
      </div>
    </main>

    <script id="ui" type="application/json">
      __UI__
    </script>
    <script>
      __SHARED__;
    </script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        // the sheets in the page's language (a German one stands in for a missing English one), named in the select
        let sheets, names;
        function setup() {
          sheets = [...document.querySelectorAll(".page")].filter((s) =>
            s.dataset.lang.split(" ").includes(lang),
          );
          names = sheets.map((s) => {
            const small = s.querySelector("h1 small");
            small.textContent = t("topic", s.dataset.sheet);
            return (
              s.dataset.sheet +
              ". " +
              s.querySelector("h1").textContent.slice(small.textContent.length)
            );
          });
          $("topic").replaceChildren(...names.map((n) => new Option(n)));
          document.documentElement.lang = lang;
        }
        setup();
        // the open sheet is kept in the hash (replaced, so Back leaves the page) and in localStorage
        const KEY = "klucz-grammar";
        const index = (name) => sheets.findIndex((s) => s.dataset.sheet === name);
        let current = 0;
        function show(i) {
          current = i;
          for (const s of document.querySelectorAll(".page")) s.hidden = s !== sheets[i];
          $("topic").selectedIndex = i;
          document.title = "Klucz - " + names[i];
          $("prev").disabled = i === 0;
          $("next").disabled = i === sheets.length - 1;
          $("prev").title = i === 0 ? t("first_topic") : names[i - 1];
          $("next").title = i === sheets.length - 1 ? t("last_topic") : names[i + 1];
          window.scrollTo(0, 0);
          try {
            localStorage.setItem(KEY, sheets[i].dataset.sheet);
          } catch {}
        }
        const fromHash = () => index(location.hash.slice(1));
        const go = (i) => {
          if (i < 0 || i >= sheets.length) return;
          history.replaceState(null, "", "#" + sheets[i].dataset.sheet);
          show(i);
        };
        addEventListener("hashchange", () => show(Math.max(fromHash(), 0)));
        // a new language: the same sheet in it, at the same height
        addEventListener("langchange", () => {
          const sheet = sheets[current].dataset.sheet;
          const y = scrollY;
          setup();
          show(Math.max(index(sheet), 0));
          scrollTo(0, y);
        });
        $("prev").onclick = () => go(current - 1);
        $("next").onclick = () => go(current + 1);
        $("topic").onchange = (e) => {
          go(e.target.selectedIndex);
          e.target.blur();
        };
        document.addEventListener("keydown", (e) => {
          if (e.target.closest("select")) return;
          if (e.key === "ArrowLeft") go(current - 1);
          if (e.key === "ArrowRight") go(current + 1);
        });
        // the book link opens the story at the reading position the story stored, as its own hash would
        try {
          const [c, p] = JSON.parse(localStorage.getItem("klucz-position"));
          $("back").href = "index.html#" + (c + 1) + (p ? "/" + p : "");
        } catch {}
        // links to the open topic and to the grammar; the topic to print
        shareButton(() => {
          const page = location.href.split("#")[0],
            sheet = sheets[current].dataset.sheet;
          return [
            { label: t("link_topic"), detail: t("topic", sheet), link: page + "#" + sheet },
            { label: t("link_grammar"), link: page },
            null,
            { label: t("print_topic"), run: () => print() },
          ];
        });
        // before printing, measure the open sheet with the print styles and shrink it if it is taller than A4
        const A4 = 1122; // 297 mm in CSS px
        const styles = [...document.querySelectorAll("style[media]")];
        addEventListener("beforeprint", () => {
          const sheet = sheets[current];
          sheet.style.removeProperty("--fit");
          styles.forEach((s) => (s.media = s.media === "print" ? "all" : "not all"));
          const height = sheet.getBoundingClientRect().height;
          styles.forEach((s) => (s.media = s.media === "all" ? "print" : "screen"));
          if (height > A4) sheet.style.setProperty("--fit", A4 / height);
        });
        // a press does not focus a button, so Space keeps scrolling the page
        document.addEventListener("mousedown", (e) => {
          if (e.target.closest("button")) e.preventDefault();
        });
        if (fromHash() < 0) {
          let stored;
          try {
            stored = localStorage.getItem(KEY);
          } catch {}
          if (index(stored) >= 0) history.replaceState(null, "", "#" + stored);
        }
        show(Math.max(fromHash(), 0));
      })();
    </script>
  </body>
</html>
