<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale stops iOS Safari from zooming in when the topic select gets focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Klucz – Grammatik</title>
    <!-- Before the first paint, so a stored theme does not flash. -->
    <script>
      try {
        document.documentElement.style.colorScheme = localStorage.getItem("klucz-theme") ?? "";
      } catch {}
    </script>
    <style>
      __BASE__
    </style>
    <style>
      /* A bar with the topic switcher and the way back to the story; below it one grammar sheet. */
      .back {
        width: var(--control);
        height: var(--control);
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--tonal);
        color: inherit;
        text-decoration: none;
      }
      .back .icon {
        font-size: 18px;
      }

      /* The sheets' print style (grammar/style.css) in the reading page's look, with the same
         selectors, so each sheet's own <style> overrides it as it does on paper. */
      @scope (.page) {
        * {
          margin: 0;
          padding: 0;
        }
        :scope {
          overflow-x: auto;
          line-height: 1.45;
        }
        h1 {
          font-family: var(--read);
          font-size: 32px;
          line-height: 1.15;
          letter-spacing: -0.3px;
          text-wrap: balance;
        }
        h1 small {
          display: block;
          font-family: var(--ui);
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 1.5px;
          text-transform: uppercase;
          color: var(--accent);
          margin-bottom: 10px;
        }
        .sub {
          font-size: 17px;
          margin-top: 8px;
        }
        h2 {
          margin-top: 32px;
          font-size: 20px;
          letter-spacing: -0.2px;
        }
        :is(h2, h3) span {
          font-weight: normal;
          color: var(--text-2);
        }
        .rule {
          margin-top: 4px;
        }

        table {
          width: 100%;
          margin-top: 8px;
          border-collapse: collapse;
          table-layout: fixed;
          font-size: 16px;
        }
        th {
          font-size: 14px;
          font-weight: 600;
          text-align: left;
          vertical-align: bottom;
          padding: 4px 10px;
          border-bottom: 2px solid var(--text);
        }
        th small {
          display: block;
          font-size: 13px;
          font-weight: normal;
          color: var(--text-2);
        }
        td {
          padding: 4px 10px;
          border-bottom: 1px solid var(--line);
          color: var(--text-2);
        }
        th:first-child,
        td:first-child {
          width: 150px;
        }
        td:first-child {
          font-style: italic;
          color: var(--text);
        }
        b {
          color: var(--text);
        }
        .stem {
          color: var(--text-2);
        }

        .cols {
          display: flex;
          gap: 24px;
          margin-top: 8px;
        }
        .col {
          flex: 1;
          min-width: 0;
        }
        .col h3 {
          font-size: 14px;
          font-weight: 600;
          padding: 4px 0;
          border-bottom: 2px solid var(--text);
        }
        .col p {
          font-size: 16px;
          padding: 4px 0;
          border-bottom: 1px solid var(--line);
          color: var(--text-2);
        }

        .box {
          margin-top: 32px;
          padding: 14px 18px;
          background: var(--surface);
          border: 1px solid var(--line); /* not a shadow: the page's overflow would clip it */
          border-radius: 16px;
          font-size: 16px;
        }
        .box h3 {
          font-size: 14px;
          font-weight: 600;
          margin-bottom: 6px;
        }
        .box table {
          margin-top: 0;
          table-layout: auto;
          font-size: inherit;
        }
        .box td {
          padding: 3px 24px 3px 0;
          border: 0;
          color: var(--text);
          font-style: normal;
        }
        .box td:first-child {
          width: auto;
        }
        .ex td:last-child {
          font-style: italic;
        }
        .note {
          margin-top: 8px;
        }

        /* the sheets' column widths are made for A4; on a phone the columns fit their content */
        @media (max-width: 640px) {
          table {
            table-layout: auto;
          }
          :is(th, td) {
            width: auto !important;
          }
          .cols {
            flex-direction: column;
            gap: 0;
          }
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <div class="switcher">
          <button class="arrow" id="prev" aria-label="Vorheriges Thema">
            <span class="icon" aria-hidden="true">chevron_left</span>
          </button>
          <select id="topic" aria-label="Thema wählen">
            __OPTIONS__
          </select>
          <button class="arrow" id="next" aria-label="Nächstes Thema">
            <span class="icon" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <a class="back" href="index.html" aria-label="Zur Geschichte" title="Zur Geschichte">
          <span class="icon" aria-hidden="true">menu_book</span>
        </a>
      </div>
    </header>

    <main>
      <div class="column">__SHEETS__</div>
    </main>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const sheets = [...document.querySelectorAll(".page")];
        const names = [...$("topic").options].map((o) => o.text);
        // the open sheet is kept in the hash (so Back returns to the one before) and in localStorage
        const KEY = "klucz-grammar";
        const index = (name) => sheets.findIndex((s) => s.dataset.sheet === name);
        let current = 0;
        function show(i) {
          sheets[current].hidden = true;
          sheets[(current = i)].hidden = false;
          $("topic").selectedIndex = i;
          $("prev").disabled = i === 0;
          $("next").disabled = i === sheets.length - 1;
          $("prev").title = i === 0 ? "Das ist das erste Thema" : names[i - 1];
          $("next").title = i === sheets.length - 1 ? "Das ist das letzte Thema" : names[i + 1];
          window.scrollTo(0, 0);
          try {
            localStorage.setItem(KEY, sheets[i].dataset.sheet);
          } catch {}
        }
        const fromHash = () => index(location.hash.slice(1));
        const go = (i) => {
          if (i >= 0 && i < sheets.length) location.hash = sheets[i].dataset.sheet;
        };
        addEventListener("hashchange", () => show(Math.max(fromHash(), 0)));
        $("prev").onclick = () => go(current - 1);
        $("next").onclick = () => go(current + 1);
        $("topic").onchange = (e) => {
          go(e.target.selectedIndex);
          e.target.blur();
        };
        document.addEventListener("keydown", (e) => {
          if (e.target.closest("select")) return;
          if (e.key === "ArrowLeft") go(current - 1);
          if (e.key === "ArrowRight") go(current + 1);
        });
        // a press does not focus a button, so Space keeps scrolling the page
        document.addEventListener("mousedown", (e) => {
          if (e.target.closest("button")) e.preventDefault();
        });
        if (fromHash() < 0) {
          let stored;
          try {
            stored = localStorage.getItem(KEY);
          } catch {}
          if (index(stored) >= 0) history.replaceState(null, "", "#" + stored);
        }
        show(Math.max(fromHash(), 0));
      })();
    </script>
  </body>
</html>
