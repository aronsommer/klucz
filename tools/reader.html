<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale stops iOS Safari from zooming in when the chapter select gets focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Klucz</title>
    <!-- Before the first paint, so a stored theme does not flash. -->
    <script>
      try {
        document.documentElement.style.colorScheme = localStorage.getItem("klucz-theme") ?? "";
      } catch {}
    </script>
    <style>
      __BASE__
    </style>
    <style>
      /* One reading column under a sticky bar; the chapter's new words follow the text. */
      /* the bookmark ribbon: hangs from the bar beside the text; the saved block lands next to it */
      .bar-inner::after {
        content: "";
        position: absolute;
        left: -13px;
        top: calc(100% + 11px); /* below the bar's padding and border */
        width: 8px;
        height: 26px;
        background: var(--accent);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 6px), 0 100%);
      }
      /* the bar: where to go on top (chapters | words, grammar), what to do with the text below
         (read aloud, copy, print | theme, fullscreen, language, translation); the column spans fill both rows */
      .switcher {
        grid-column: span 5;
      }
      #to-words {
        grid-column: span 2;
      }
      /* the translation switch: Polish and the chosen language, the one shown cut out of a solid fill; a tap switches */
      #translate {
        grid-column: span 2;
        padding: 3px;
        gap: 2px;
      }
      #translate span {
        flex: 1;
        align-self: stretch;
        display: grid;
        place-items: center;
        border-radius: 6px;
        color: var(--text-2);
      }
      #translate .on {
        background: var(--text);
        color: var(--tonal);
      }
      /* the language button: a globe under an invisible select, so the device shows its own menu */
      .lang {
        position: relative;
      }
      .lang select {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .lang:has(select:focus-visible:not(.by-pointer)) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* the stop icon while reading aloud */
      .filled {
        font-variation-settings: "FILL" 1;
      }
      @media (min-width: 641px) {
        .switcher {
          grid-column: span 4;
        }
        #grammar {
          grid-column: span 2;
        }
      }
      /* without fullscreen (iPhone) the translation button takes its column */
      .bar-inner:has(#fullscreen[hidden]) #translate {
        grid-column: span 3;
      }
      /* the arrow glyph has 3px of empty space on its left, so both ends look even */
      #to-words .icon {
        margin-left: -3px;
      }
      .copy {
        position: relative;
      }
      #copy.done {
        background: var(--accent);
        color: var(--on-accent);
      }
      /* the chapter's parts to pick from: under the copy button, on a phone from the left edge so it fits */
      .copy-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        display: grid;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .copy-menu button {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        border: 0;
        border-radius: 8px;
        background: none;
        padding: 8px 12px;
        white-space: nowrap;
        cursor: pointer;
      }
      .copy-menu button:hover {
        background: var(--highlight);
      }
      .copy-menu small {
        font-size: 13px;
        color: var(--text-2);
      }

      .tap-hint {
        font-family: var(--ui);
        font-size: 15px;
        color: var(--text-2);
        margin: 0 0 24px;
      }

      article {
        font-family: var(--read);
        font-size: 19px;
        line-height: 1.7;
        font-optical-sizing: auto;
      }
      article h1 {
        font-size: 34px;
        line-height: 1.15;
        text-wrap: balance;
        margin: 0 0 8px;
        letter-spacing: -0.3px;
      }
      article h1 small {
        display: block;
        font-family: var(--ui);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      article h1 small .pair {
        display: inline-grid;
      }
      article .date {
        font-style: italic;
        color: var(--text-2);
        margin: 0 0 32px;
      }
      article p {
        margin: 0 0 18px;
        white-space: pre-line;
      }
      article blockquote {
        margin: 22px 0;
        padding: 4px 0 4px 18px;
        border-left: 3px solid var(--tonal);
        font-style: italic;
      }
      article .break {
        text-align: center;
        margin: 28px 0;
        color: var(--text-2);
        letter-spacing: 8px;
      }
      /* a block and its translation share one grid cell, so switching never moves the text */
      .pair {
        display: grid;
      }
      .pair > * {
        grid-area: 1 / 1;
      }
      .pair > .tr,
      .translated .pair > .pl {
        visibility: hidden;
      }
      .translated .pair > .tr {
        visibility: visible;
      }
      .w {
        cursor: pointer;
        border-radius: 3px;
      }
      /* the title or paragraph being read aloud */
      article .reading {
        --tint: color-mix(in srgb, var(--accent) 10%, transparent);
        background: var(--tint);
        box-shadow: 0 0 0 6px var(--tint);
        border-radius: 2px;
      }
      .w:hover,
      .w.active {
        background: var(--highlight);
      }

      .pop {
        position: absolute;
        z-index: 40;
        width: min(320px, calc(100vw - 32px));
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        padding: 14px 16px;
      }
      /* the tapped form and what form it is, above the entry */
      .pop .form {
        color: var(--text-2);
        font-size: 14px;
        margin-bottom: 4px;
      }
      .pop .form span {
        font-family: var(--read);
        font-size: 17px;
        color: var(--text);
      }
      .pop .grammar {
        color: var(--text-2);
        font-size: 14px;
        margin-top: 2px;
      }
      .pop b {
        font-family: var(--read);
        font-size: 21px;
      }
      .say {
        display: block;
        margin-top: 8px;
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        cursor: pointer;
      }
      .pop i {
        font-style: normal;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        margin-left: 8px;
      }
      .pop p {
        margin: 6px 0 0;
        font-size: 16px;
        line-height: 1.45;
      }
      .close {
        display: none;
        float: right;
        width: 32px;
        height: 32px;
        margin: -4px -6px 0 8px;
        border: 0;
        border-radius: 50%;
        background: var(--tonal);
        color: var(--text-2);
        cursor: pointer;
        place-items: center;
        padding: 0;
      }
      @media (max-width: 640px) {
        .close {
          display: grid;
        }
        .pop {
          position: fixed;
          left: 0 !important;
          right: 0;
          top: auto !important;
          bottom: 0;
          width: auto;
          border-radius: 20px 20px 0 0;
          border-width: 1px 0 0;
          padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
          padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px));
        }
      }

      section {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      section h2 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0 0 4px;
      }
      section .hint {
        color: var(--text-2);
        margin: 0 0 16px;
        line-height: 1.5;
      }
      .words {
        margin: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 20px;
        background: var(--surface);
        border-radius: 16px;
        padding: 4px 16px;
        box-shadow: var(--shadow);
      }
      .words dt,
      .words dd {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        margin: 0;
      }
      .words dt:nth-last-of-type(1),
      .words dd:last-child {
        border-bottom: 0;
      }
      .words dt {
        font-family: var(--read);
        font-weight: 700;
        font-size: 16px;
      }
      .words small {
        display: block;
        font-family: var(--ui);
        font-weight: 400;
        font-size: 13px;
        color: var(--text-2);
        margin-top: 2px;
      }
      .words dt i {
        font-family: var(--ui);
        font-style: normal;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        margin-left: 5px;
      }
      .words dd {
        min-width: 0;
        line-height: 1.45;
        font-size: 15px;
      }

      .toast {
        position: absolute;
        z-index: 50;
        left: 50%;
        transform: translateX(-50%);
        top: calc(100% + 12px);
        width: max-content;
        max-width: calc(100vw - 32px);
        background: var(--text);
        color: var(--bg);
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      footer {
        margin-top: 48px;
        text-align: center;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-2);
        text-wrap: balance;
      }
      footer a {
        color: inherit;
      }
      #book {
        display: none;
      }
      .fallback {
        position: fixed;
        left: 0;
        top: 0;
        opacity: 0;
        pointer-events: none;
      }

      @media (max-width: 480px) {
        /* the copy menu starts at the bar's left edge, so it fits */
        .copy {
          position: static;
        }
        article {
          font-size: 18px;
        }
        article h1 {
          font-size: 28px;
        }
        .words {
          grid-template-columns: 1fr;
        }
        .words dt {
          border-bottom: 0;
          padding-bottom: 0;
        }
      }
      @media print {
        :root {
          color-scheme: light !important; /* over the theme button's inline style */
        }
        body {
          background: #fff;
          color: #000;
        }
        body::before,
        .bar,
        .pop,
        .toast,
        .tap-hint {
          display: none !important;
        }
        main {
          padding: 0;
        }
        article {
          font-size: 15px;
        }
        .words {
          font-size: 12px;
          box-shadow: none;
          padding: 0;
        }
        /* the print button prints the whole book instead of the open chapter */
        .print-all main {
          display: none;
        }
        .print-all #book {
          display: block;
        }
        #book > div + div {
          break-before: page;
        }
        .pair > .tr {
          display: none;
        }
        .translated .pair > .pl {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <div class="switcher">
          <button class="arrow" id="prev" data-tip="prev_chapter">
            <span class="icon" aria-hidden="true">chevron_left</span>
          </button>
          <select id="chapter" data-tip="choose_chapter"></select>
          <button class="arrow" id="next" data-tip="next_chapter">
            <span class="icon" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <button class="tool" id="to-words" data-tip="to_words">
          <span class="icon" aria-hidden="true">arrow_downward</span><span data-t="words"></span>
        </button>
        <a class="tool" id="grammar" href="grammar.html" data-tip="open_grammar">
          <span class="icon" aria-hidden="true">school</span
          ><span class="label" data-t="grammar"></span>
        </a>
        <button class="tool" id="read"></button>
        <div class="copy">
          <button class="tool" id="copy" data-tip="copy_chapter" aria-expanded="false">
            <span class="icon" aria-hidden="true">content_copy</span>
          </button>
          <div class="copy-menu" id="copy-menu" hidden></div>
        </div>
        <button class="tool" id="print" data-tip="print_book">
          <span class="icon" aria-hidden="true">print</span>
        </button>
        <button class="tool" id="theme">
          <span class="icon" aria-hidden="true">dark_mode</span>
        </button>
        <button class="tool" id="fullscreen">
          <span class="icon" aria-hidden="true">fullscreen</span>
        </button>
        <label class="tool lang">
          <span class="icon" aria-hidden="true">language</span>
          <select id="lang" data-tip="language">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </label>
        <button class="tool" id="translate"></button>
      </div>
      <div class="toast" id="toast" hidden role="status"></div>
    </header>

    <main>
      <div class="column">
        <p class="tap-hint" data-t="tap_hint"></p>
        <article id="text"></article>
        <section>
          <h2 id="words-title"></h2>
          <p class="hint" data-t="words_hint"></p>
          <dl class="words" id="words"></dl>
        </section>
        <!-- The deploy workflow replaces this with the UTC time of the deploy. -->
        <footer>
          <span data-t="about"></span><br />
          <a href="https://github.com/aronsommer/klucz">GitHub</a> · Version __BUILD_TIMESTAMP__
        </footer>
      </div>
    </main>
    <div id="book"></div>

    <div class="pop" id="pop" hidden role="dialog"></div>
    <textarea class="fallback" id="fallback" tabindex="-1" aria-hidden="true" readonly></textarea>

    <script id="data" type="application/json">
      __DATA__
    </script>
    <script id="ui" type="application/json">
      __UI__
    </script>
    <script>
      __SHARED__;
    </script>
    <script>
      (() => {
        // W: [headword, {lang: [part of speech, grammar, meaning]}]; F: {lang: descriptions of word forms, e.g. "Genitiv Pl."}
        const {
          chapters: CH,
          words: W,
          forms: F,
        } = JSON.parse(document.getElementById("data").textContent);
        const $ = (id) => document.getElementById(id);
        const el = (tag, cls, text) => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        };
        const icon = (n) => {
          const i = el("span", "icon", n);
          i.setAttribute("aria-hidden", "true");
          return i;
        };
        const name = (i) => CH[i].title.replace(/^Rozdział \d+\.\s*/, "");
        let ch = 0,
          active = null,
          toastTimer,
          copyTimer,
          reading = null; // the utterance being read aloud

        CH.forEach((_, i) => $("chapter").append(new Option(i + 1 + ". " + name(i), i)));

        // append text segments to e, each word a tappable span
        function fill(e, segs) {
          for (const s of segs) {
            if (typeof s === "string") {
              e.append(s);
              continue;
            }
            const w = el("span", "w", s[0]);
            w.dataset.i = s[1];
            if (s.length > 2) w.dataset.f = s[2]; // the form is not the headword
            e.append(w);
          }
          return e;
        }
        // the text segments, and their translation tr (if any) in the same place
        function both(e, segs, tr) {
          if (tr == null) return fill(e, segs);
          const pl = fill(el("span", "pl"), segs),
            translated = el("span", "tr", tr),
            pair = el("span", "pair");
          translated.lang = lang;
          pair.append(pl, translated);
          e.append(pair);
          return e;
        }
        const line = (kind, segs, tr) => both(el("p", kind === "date" ? "date" : ""), segs, tr);

        // chapter i's text blocks, for an article
        function text(i) {
          const f = document.createDocumentFragment();
          let quote = null;
          const translation = CH[i].tr[lang];
          for (const [n, [kind, segs]] of CH[i].blocks.entries()) {
            const tr = translation?.[n];
            if (kind !== "quote") quote = null;
            if (kind === "title") {
              const h = el("h1"),
                small = el("small"),
                of = [i + 1, CH.length];
              small.append("Klucz · ");
              h.append(
                both(
                  small,
                  [`Rozdział ${of[0]} z ${of[1]}`],
                  translation && t("chapter_of", ...of),
                ),
              );
              // the name only: "Rozdział N. " is skipped, the small line above shows it
              const start = segs.findIndex((s) => typeof s === "string" && /\d+\.\s*$/.test(s)) + 1;
              f.append(both(h, segs.slice(start), tr?.replace(/^\S+ \d+\.\s*/, "")));
            } else if (kind === "break") {
              const b = el("div", "break", "* * *");
              b.setAttribute("role", "separator");
              f.append(b);
            } else if (kind === "quote") {
              if (!quote) f.append((quote = el("blockquote")));
              quote.append(line(kind, segs, tr));
            } else {
              f.append(line(kind, segs, tr));
            }
          }
          return f;
        }
        // chapter i's new words, for a .words list
        function words(i) {
          const f = document.createDocumentFragment();
          for (const [id, form, d] of CH[i].words) {
            const [
              word,
              {
                [lang]: [pos, grammar, meaning],
              },
            ] = W[id];
            const dt = el("dt", "", word);
            if (pos) dt.append(el("i", "", pos));
            if (grammar) dt.append(el("small", "", grammar));
            const dd = el("dd", "", meaning);
            if (form)
              dd.append(
                el("small", "", t("in_text", form + (F[lang][d] ? " (" + F[lang][d] + ")" : ""))),
              );
            f.append(dt, dd);
          }
          return f;
        }
        const wordsTitle = (i) => t("new_words") + " · " + CH[i].words.length;
        const pageTitle = () => "Klucz · " + (ch + 1) + ". " + name(ch);

        function render() {
          $("text").replaceChildren(text(ch));
          $("words-title").textContent = wordsTitle(ch);
          $("words").replaceChildren(words(ch));

          $("chapter").value = ch;
          $("prev").disabled = ch === 0;
          $("next").disabled = ch === CH.length - 1;
          translate(translated);
          $("prev").title = ch === 0 ? t("first_chapter") : "Rozdział " + ch + ": " + name(ch - 1);
          $("next").title =
            ch === CH.length - 1 ? t("last_chapter") : "Rozdział " + (ch + 2) + ": " + name(ch + 1);
          document.title = pageTitle();
        }

        function go(i, p = 0) {
          if (i < 0 || i >= CH.length) return;
          if (i !== ch) {
            ch = i;
            closePop();
            openMenu(false);
            if (reading) read(null);
            render();
          }
          scrollToBlock(p);
          save();
        }

        // reading position: the top block of the article under the bar, kept in the hash (#5/12) and in localStorage
        const KEY = "klucz-position";
        const barBottom = () => document.querySelector(".bar").getBoundingClientRect().bottom;
        let saveTimer;
        function scrollToBlock(p) {
          const b = $("text").children[p];
          window.scrollTo(
            0,
            p && b ? b.getBoundingClientRect().top + window.scrollY - barBottom() - 16 : 0,
          );
        }
        function topBlock() {
          const blocks = $("text").children,
            top = barBottom() + 24;
          let p = 0;
          while (p + 1 < blocks.length && blocks[p + 1].getBoundingClientRect().top <= top) p++;
          return p;
        }
        function save() {
          const p = topBlock();
          try {
            history.replaceState(null, "", "#" + (ch + 1) + (p ? "/" + p : ""));
          } catch {}
          try {
            localStorage.setItem(KEY, JSON.stringify([ch, p]));
          } catch {}
        }
        window.addEventListener(
          "scroll",
          () => {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(save, 200);
          },
          { passive: true },
        );

        // tap a word: its form, its word list entry and translation
        function openPop(w) {
          closePop();
          openMenu(false);
          active = w;
          w.classList.add("active");
          const [
            word,
            {
              [lang]: [pos, grammar, meaning],
            },
          ] = W[w.dataset.i];
          const pop = $("pop");
          pop.textContent = "";
          pop.ariaLabel = t("translation");
          const close = el("button", "close"); // shown only on the bottom sheet
          close.title = close.ariaLabel = t("close");
          close.append(icon("close"));
          close.onclick = closePop;
          pop.append(close);
          if (w.dataset.f != null) {
            const form = el("div", "form");
            form.append(el("span", "", w.textContent));
            if (F[lang][w.dataset.f]) form.append(" · " + F[lang][w.dataset.f]);
            pop.append(form);
          }
          pop.append(el("b", "", word));
          if (pos) pop.append(el("i", "", pos));
          if (grammar) pop.append(el("div", "grammar", grammar));
          pop.append(el("p", "", meaning));
          if (window.speechSynthesis) {
            const say = el("button", "say");
            say.title = say.ariaLabel = t("pronounce");
            say.append(icon("volume_up"));
            say.onclick = () => {
              read(null);
              speak(w.textContent);
            };
            pop.append(say);
          }
          pop.hidden = false;
          if (matchMedia("(min-width: 641px)").matches) {
            const r = w.getBoundingClientRect();
            const width = pop.offsetWidth;
            const left = Math.max(
              16,
              Math.min(
                r.left + r.width / 2 - width / 2,
                document.documentElement.clientWidth - width - 16,
              ),
            );
            const below = r.bottom + pop.offsetHeight + 16 <= window.innerHeight;
            pop.style.left = left + window.scrollX + "px";
            pop.style.top =
              (below ? r.bottom + 8 : r.top - pop.offsetHeight - 8) + window.scrollY + "px";
          }
        }
        // the device's own Polish voice, if it has one
        function speak(text, rate = 1) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "pl-PL";
          u.voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith("pl")) || null;
          u.rate = rate;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          return u;
        }
        // the title and paragraphs, in reading order
        const readable = () => [...$("text").querySelectorAll("h1, p")];
        // read the chapter aloud block by block from p, slower, marking the one being read; no p stops
        function read(p) {
          document.querySelector(".reading")?.classList.remove("reading");
          readButton(!!p);
          if (!p) {
            reading = null;
            return speechSynthesis.cancel();
          }
          p.classList.add("reading");
          // the title by its name only, without the chapter number
          const text = p.tagName === "H1" ? name(ch) : (p.querySelector(".pl") ?? p).textContent;
          const u = (reading = speak(text, 0.8));
          const all = readable();
          u.onend = () => reading === u && read(all[all.indexOf(p) + 1]);
          u.onerror = () => reading === u && read(null);
        }
        // starts at the first block starting in the upper half below the bar; failing that (a long
        // block above it), at the block reaching below the bar
        const readButton = (on) => {
          const i = icon(on ? "stop" : "volume_up");
          i.classList.toggle("filled", on);
          $("read").replaceChildren(i);
          $("read").title = $("read").ariaLabel = t(on ? "stop_title" : "read_title");
        };
        readButton(false);
        $("read").hidden = !window.speechSynthesis;
        $("read").onclick = () => {
          const all = readable(),
            bar = barBottom();
          read(
            reading
              ? null
              : (all.find((p) => {
                  const top = p.getBoundingClientRect().top;
                  return top >= bar && top < (bar + window.innerHeight) / 2;
                }) ??
                  all.find((p) => p.getBoundingClientRect().bottom > bar) ??
                  all[0]),
          );
        };
        function closePop() {
          $("pop").hidden = true;
          if (active) active.classList.remove("active");
          active = null;
        }
        $("text").addEventListener("click", (e) => {
          const w = e.target.closest(".w");
          if (!w) return;
          e.stopPropagation();
          w === active ? closePop() : openPop(w);
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest("#pop")) closePop();
          if (!e.target.closest(".copy")) openMenu(false);
        });

        // the whole chapter, or a menu with it and its parts if it is longer than the 5,000 characters Google Translate accepts
        $("copy").onclick = () => {
          const parts = CH[ch].parts;
          if (parts.length === 1) return copy(parts[0]);
          if (!$("copy-menu").hidden) return openMenu(false);
          const item = (text, label) => {
            const b = el("button", "", label);
            b.append(el("small", "", t("characters", text.length)));
            b.onclick = () => {
              openMenu(false);
              copy(text);
            };
            return b;
          };
          $("copy-menu").replaceChildren(
            item(parts.join("\n\n"), t("whole_chapter")),
            ...parts.map((text, i) => item(text, t("part", i + 1))),
          );
          openMenu(true);
        };
        function openMenu(open) {
          $("copy-menu").hidden = !open;
          $("copy").ariaExpanded = open;
        }
        function toast(msg) {
          const box = $("toast");
          box.textContent = msg;
          box.hidden = false;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            box.hidden = true;
          }, 3500);
        }
        // success shows on the button only; a failure needs the message
        async function copy(text) {
          let ok = false;
          try {
            await navigator.clipboard.writeText(text);
            ok = true;
          } catch {
            const ta = $("fallback");
            ta.value = text;
            ta.select();
            try {
              ok = document.execCommand("copy");
            } catch {}
          }
          const mark = (done) => {
            $("copy").classList.toggle("done", done);
            $("copy").firstElementChild.textContent = done ? "check" : "content_copy";
          };
          clearTimeout(copyTimer);
          mark(ok);
          if (ok) copyTimer = setTimeout(() => mark(false), 2000);
          else toast(t("copy_blocked"));
        }

        $("to-words").onclick = () => {
          const top =
            $("words-title").getBoundingClientRect().top + window.scrollY - barBottom() - 24;
          window.scrollTo({ top, behavior: "smooth" });
        };
        // every chapter with its words, each starting on a new page; built only while printing
        $("print").onclick = () => {
          $("book").replaceChildren(
            ...CH.map((_, i) => {
              const art = el("article"),
                list = el("dl", "words"),
                sec = el("section"),
                page = el("div");
              art.append(text(i));
              list.append(words(i));
              sec.append(el("h2", "", wordsTitle(i)), list);
              page.append(art, sec);
              return page;
            }),
          );
          document.documentElement.classList.add("print-all");
          document.title = "Klucz"; // also the file name when saved as PDF
          window.print();
        };
        window.addEventListener("afterprint", () => {
          document.documentElement.classList.remove("print-all");
          $("book").replaceChildren();
          document.title = pageTitle();
        });
        // the text in Polish or in the chosen language
        let translated = false;
        function translate(on) {
          translated = on;
          document.documentElement.classList.toggle("translated", on);
          $("translate").hidden = !CH[ch].tr[lang];
          $("translate").replaceChildren(
            el("span", on ? "" : "on", "PL"),
            el("span", on ? "on" : "", t("lang_code")),
          );
          $("translate").title = $("translate").ariaLabel = t(
            on ? "read_polish" : "read_translation",
          );
        }
        $("translate").onclick = () => {
          closePop();
          translate(!translated);
        };
        // hidden where a page cannot go fullscreen (iPhone)
        $("fullscreen").hidden = !document.fullscreenEnabled;
        $("fullscreen").onclick = () =>
          document.fullscreenElement
            ? document.exitFullscreen()
            : document.documentElement.requestFullscreen();
        const fullscreenButton = () => {
          const on = !!document.fullscreenElement;
          $("fullscreen").firstElementChild.textContent = on ? "fullscreen_exit" : "fullscreen";
          $("fullscreen").title = $("fullscreen").ariaLabel = t(
            on ? "fullscreen_exit" : "fullscreen",
          );
        };
        document.addEventListener("fullscreenchange", fullscreenButton);
        fullscreenButton();
        $("lang").value = lang;
        $("lang").onchange = (e) => {
          e.target.blur();
          setLang(e.target.value);
        };
        // a new language: every text of the page in it, at the same reading position
        addEventListener("langchange", () => {
          closePop();
          openMenu(false);
          fullscreenButton();
          if (reading)
            read(null); // its block is redrawn
          else readButton(false);
          const p = topBlock();
          render();
          scrollToBlock(p);
        });
        $("prev").onclick = () => go(ch - 1);
        $("next").onclick = () => go(ch + 1);
        $("chapter").onchange = (e) => {
          go(+e.target.value);
          e.target.blur();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closePop();
            openMenu(false);
          }
          if (e.target.closest("select")) return;
          if (e.key === "ArrowLeft") go(ch - 1);
          if (e.key === "ArrowRight") go(ch + 1);
        });
        // a press does not focus a button, so Space keeps scrolling the page
        document.addEventListener("mousedown", (e) => {
          if (e.target.closest("button")) e.preventDefault();
        });
        const clamp = (i) => Math.min(Math.max(i, 0), CH.length - 1);
        const fromHash = () => {
          const m = location.hash.match(/^#(\d+)(?:\/(\d+))?$/);
          return m && [clamp(+m[1] - 1), +(m[2] || 0)];
        };
        const stored = () => {
          try {
            const [c, p] = JSON.parse(localStorage.getItem(KEY));
            return [clamp(c), p];
          } catch {}
        };
        window.addEventListener("hashchange", () => go(...(fromHash() || [0, 0])));
        const saved = !fromHash() && stored();
        const [c, p] = fromHash() || saved || [0, 0];
        ch = c;
        render();
        history.scrollRestoration = "manual"; // on reload the browser would scroll to the old offset after our jump
        document.fonts.ready.then(() => go(c, p)); // the layout settles once the fonts are in
        if (saved && (c || p)) toast(t("continue", c + 1));
      })();
    </script>
  </body>
</html>
