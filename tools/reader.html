<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale stops iOS Safari from zooming in when the chapter select gets focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Klucz</title>
    <style>
      __FONTS__
    </style>
    <style>
      /* A green-tinted neutral paper with one red accent; word hover stays neutral. */
      /* One reading column under a sticky bar (chapter switcher, a jump to the words and the DE/PL switch, then the copy and print buttons); the chapter's new words follow the text. */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f2f4f1, #111614);
        --surface: light-dark(#fbfcfa, #171d1b);
        --tonal: light-dark(#e3e8e5, #242c29);
        --line: light-dark(#d3dad6, #2a3330);
        --text: light-dark(#1c2321, #e3e8e5);
        --text-2: light-dark(#5d6965, #98a59f);
        --accent: light-dark(#a8283f, #e8715f);
        --on-accent: light-dark(#ffffff, #101513);
        --highlight: light-dark(#dfe6e2, #29332f);
        --shadow:
          0 1px 2px light-dark(rgb(60 64 67 / 0.12), transparent),
          0 4px 12px light-dark(rgb(60 64 67 / 0.12), rgb(0 0 0 / 0.5));
        --control: 32px; /* every button and the chapter select */
        --read: "Literata", Georgia, "Times New Roman", serif;
        --ui: "Figtree", system-ui, sans-serif;
        font-family: var(--ui);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; /* no zoom on a double tap */
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--surface);
      }
      button,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .icon {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        display: inline-block;
        vertical-align: middle;
        white-space: nowrap;
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 10px;
      }
      .bar-inner,
      .copy-row {
        max-width: 680px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      /* previous, chapter, next: one control on one surface */
      .chapter-nav {
        display: flex;
        min-width: 0;
        background: var(--tonal);
        border-radius: 8px;
      }
      .bar select {
        min-width: 0;
        max-width: 260px;
        height: var(--control);
        border: 0;
        border-inline: 1px solid var(--line);
        background: none;
        padding: 0 12px;
        font-weight: 500;
      }
      .arrow {
        width: var(--control);
        height: var(--control);
        flex: none;
        border: 0;
        background: none;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .arrow .icon {
        font-size: 24px;
      }
      .arrow:disabled {
        color: var(--text-2);
        opacity: 0.5;
        cursor: not-allowed;
      }
      .copy-row {
        margin-top: 10px;
        flex-wrap: wrap;
        position: relative;
      }
      /* the bookmark ribbon: hangs from the bar beside the text; the saved block lands next to it */
      .copy-row::after {
        content: "";
        position: absolute;
        left: -13px;
        top: calc(100% + 11px); /* below the bar's padding and border */
        width: 8px;
        height: 26px;
        background: var(--accent);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 6px), 0 100%);
      }
      #copy {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      #to-words,
      #german,
      .copy-row button {
        height: var(--control);
        border: 0;
        background: var(--tonal);
        border-radius: 8px;
        padding: 0 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      #to-words .icon,
      .copy-row button .icon {
        font-size: 18px;
      }
      #to-words {
        flex: none;
        margin-left: auto;
      }
      /* the language switch and the print button below it: one size */
      #german,
      #print {
        width: var(--control);
        flex: none;
        padding: 0;
        justify-content: center;
      }
      .copy-row button.done {
        background: var(--accent);
        color: var(--on-accent);
      }

      main {
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 40px 64px;
      }
      .column {
        max-width: 680px;
        margin: 0 auto;
      }

      article {
        font-family: var(--read);
        font-size: 19px;
        line-height: 1.7;
        font-optical-sizing: auto;
      }
      article h1 {
        font-size: 34px;
        line-height: 1.15;
        text-wrap: balance;
        margin: 0 0 8px;
        letter-spacing: -0.3px;
      }
      article h1 small {
        display: block;
        font-family: var(--ui);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      article h1 small .pair {
        display: inline-grid;
      }
      article .date {
        font-style: italic;
        color: var(--text-2);
        margin: 0 0 32px;
      }
      article p {
        margin: 0 0 18px;
        white-space: pre-line;
      }
      article blockquote {
        margin: 22px 0;
        padding: 4px 0 4px 18px;
        border-left: 3px solid var(--tonal);
        font-style: italic;
      }
      article .break {
        text-align: center;
        margin: 28px 0;
        color: var(--text-2);
        letter-spacing: 8px;
      }
      /* a block and its translation share one grid cell, so switching never moves the text */
      .pair {
        display: grid;
      }
      .pair > * {
        grid-area: 1 / 1;
      }
      .pair > .de,
      .german .pair > .pl {
        visibility: hidden;
      }
      .german .pair > .de {
        visibility: visible;
      }
      .w {
        cursor: pointer;
        border-radius: 3px;
      }
      .w:hover,
      .w.active {
        background: var(--highlight);
      }

      .pop {
        position: absolute;
        z-index: 40;
        width: min(320px, calc(100vw - 32px));
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        padding: 14px 16px;
      }
      .pop .form {
        font-family: var(--read);
        color: var(--text-2);
        font-size: 17px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 4px;
      }
      .pop .form .icon {
        font-size: 18px;
      }
      .pop b {
        font-family: var(--read);
        font-size: 21px;
      }
      .say {
        display: block;
        margin-top: 8px;
        border: 0;
        background: none;
        padding: 0;
        color: var(--accent);
        cursor: pointer;
      }
      .pop i {
        font-style: normal;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        margin-left: 8px;
      }
      .pop p {
        margin: 6px 0 0;
        font-size: 16px;
        line-height: 1.45;
      }
      .close {
        display: none;
        float: right;
        width: 32px;
        height: 32px;
        margin: -4px -6px 0 8px;
        border: 0;
        border-radius: 50%;
        background: var(--tonal);
        color: var(--text-2);
        cursor: pointer;
        place-items: center;
        padding: 0;
      }
      @media (max-width: 640px) {
        .close {
          display: grid;
        }
        .pop {
          position: fixed;
          left: 0 !important;
          right: 0;
          top: auto !important;
          bottom: 0;
          width: auto;
          border-radius: 20px 20px 0 0;
          border-width: 1px 0 0;
          padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
          padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px));
        }
      }

      section {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }
      section h2 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0 0 4px;
      }
      section .hint {
        color: var(--text-2);
        margin: 0 0 16px;
        line-height: 1.5;
      }
      .words {
        margin: 0;
        display: grid;
        grid-template-columns: minmax(120px, max-content) 1fr;
        column-gap: 20px;
        background: var(--surface);
        border-radius: 16px;
        padding: 4px 16px;
        box-shadow: var(--shadow);
      }
      .words dt,
      .words dd {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        margin: 0;
      }
      .words dt:nth-last-of-type(1),
      .words dd:last-child {
        border-bottom: 0;
      }
      .words dt {
        font-family: var(--read);
        font-weight: 700;
        font-size: 16px;
      }
      .words dt small {
        font-weight: 400;
        color: var(--text-2);
      }
      .words dt i {
        font-family: var(--ui);
        font-style: normal;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        margin-left: 5px;
      }
      .words dd {
        min-width: 0;
        line-height: 1.45;
        font-size: 15px;
      }

      .toast {
        position: absolute;
        z-index: 50;
        left: 50%;
        transform: translateX(-50%);
        top: calc(100% + 12px);
        width: max-content;
        max-width: calc(100vw - 32px);
        background: var(--text);
        color: var(--bg);
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      #book {
        display: none;
      }
      .fallback {
        position: fixed;
        left: 0;
        top: 0;
        opacity: 0;
        pointer-events: none;
      }

      @media (max-width: 480px) {
        article {
          font-size: 18px;
        }
        article h1 {
          font-size: 28px;
        }
        .words {
          grid-template-columns: 1fr;
        }
        .words dt {
          border-bottom: 0;
          padding-bottom: 0;
        }
        .copy-row button {
          padding: 0 8px;
        }
        .copy-row .long {
          display: none;
        } /* "Teil 1" becomes "1", so all buttons fit one row */
      }
      @media print {
        :root {
          color-scheme: light;
        }
        body {
          background: #fff;
          color: #000;
        }
        body::before,
        .bar,
        .pop,
        .toast {
          display: none !important;
        }
        main {
          padding: 0;
        }
        article {
          font-size: 15px;
        }
        .words {
          font-size: 12px;
          box-shadow: none;
          padding: 0;
        }
        /* the print button prints the whole book instead of the open chapter */
        .print-all main {
          display: none;
        }
        .print-all #book {
          display: block;
        }
        #book > div + div {
          break-before: page;
        }
        .pair > .de {
          display: none;
        }
        .german .pair > .pl {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="bar-inner">
        <div class="chapter-nav">
          <button class="arrow" id="prev" aria-label="Vorheriges Kapitel">
            <span class="icon" aria-hidden="true">chevron_left</span>
          </button>
          <select id="chapter" aria-label="Kapitel wählen"></select>
          <button class="arrow" id="next" aria-label="Nächstes Kapitel">
            <span class="icon" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <button id="to-words">
          <span class="icon" aria-hidden="true">arrow_downward</span>Wörter
        </button>
        <button id="german" title="Deutsch zeigen">DE</button>
      </div>
      <div class="copy-row">
        <div id="copy" aria-label="Text kopieren"></div>
        <button id="print" aria-label="Ganzes Buch drucken" title="Ganzes Buch drucken">
          <span class="icon" aria-hidden="true">print</span>
        </button>
      </div>
      <div class="toast" id="toast" hidden role="status"></div>
    </header>

    <main>
      <div class="column">
        <article id="text"></article>
        <section>
          <h2 id="words-title">Neue Wörter</h2>
          <p class="hint">
            Alle Wörter, die in diesem Kapitel zum ersten Mal vorkommen, alphabetisch. Jedes Wort im
            Text lässt sich antippen.<br />m/f/n: Genus · uv./v.: unvollendeter/vollendeter Aspekt
          </p>
          <dl class="words" id="words"></dl>
        </section>
      </div>
    </main>
    <div id="book"></div>

    <div class="pop" id="pop" hidden role="dialog" aria-label="Übersetzung"></div>
    <textarea class="fallback" id="fallback" tabindex="-1" aria-hidden="true" readonly></textarea>

    <script id="data" type="application/json">
      __DATA__
    </script>
    <script>
      (() => {
        const { chapters: CH, words: W } = JSON.parse(document.getElementById("data").textContent); // W: [lemma, tag, German]
        const $ = (id) => document.getElementById(id);
        const el = (tag, cls, text) => {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          return e;
        };
        const icon = (n) => {
          const i = el("span", "icon", n);
          i.setAttribute("aria-hidden", "true");
          return i;
        };
        const name = (i) => CH[i].title.replace(/^Rozdział \d+\.\s*/, "");
        let ch = 0,
          active = null,
          toastTimer;

        CH.forEach((_, i) => $("chapter").append(new Option(i + 1 + ". " + name(i), i)));

        // append text segments to e, each word a tappable span
        function fill(e, segs) {
          for (const s of segs) {
            if (typeof s === "string") {
              e.append(s);
              continue;
            }
            const w = el("span", "w", s[0]);
            w.dataset.i = s[1];
            e.append(w);
          }
          return e;
        }
        // the text segments, and the German translation de (if any) in the same place
        function both(e, segs, de) {
          if (de == null) return fill(e, segs);
          const pl = fill(el("span", "pl"), segs),
            german = el("span", "de", de),
            pair = el("span", "pair");
          german.lang = "de";
          pair.append(pl, german);
          e.append(pair);
          return e;
        }
        const line = (kind, segs, de) => both(el("p", kind === "date" ? "date" : ""), segs, de);

        // chapter i's text blocks, for an article
        function text(i) {
          const f = document.createDocumentFragment();
          let quote = null;
          for (const [n, [kind, segs]] of CH[i].blocks.entries()) {
            const de = CH[i].de?.[n];
            if (kind !== "quote") quote = null;
            if (kind === "title") {
              const h = el("h1"),
                small = el("small"),
                of = [i + 1, CH.length];
              small.append("Klucz · ");
              h.append(
                both(
                  small,
                  [`Rozdział ${of[0]} z ${of[1]}`],
                  CH[i].de && `Kapitel ${of[0]} von ${of[1]}`,
                ),
              );
              // the name only: "Rozdział N. " is skipped, the small line above shows it
              const start = segs.findIndex((s) => typeof s === "string" && /\d+\.\s*$/.test(s)) + 1;
              f.append(both(h, segs.slice(start), de?.replace(/^\S+ \d+\.\s*/, "")));
            } else if (kind === "break") {
              const b = el("div", "break", "* * *");
              b.setAttribute("role", "separator");
              f.append(b);
            } else if (kind === "quote") {
              if (!quote) f.append((quote = el("blockquote")));
              quote.append(line(kind, segs, de));
            } else {
              f.append(line(kind, segs, de));
            }
          }
          return f;
        }
        // chapter i's new words, for a .words list
        function words(i) {
          const f = document.createDocumentFragment();
          for (const [id, form] of CH[i].words) {
            const [lemma, tag, de] = W[id];
            const dt = el("dt", "", lemma);
            if (form) dt.append(" ", el("small", "", "(" + form + ")"));
            if (tag) dt.append(el("i", "", tag));
            f.append(dt, el("dd", "", de));
          }
          return f;
        }
        const wordsTitle = (i) => "Neue Wörter · " + CH[i].words.length;
        const pageTitle = () => "Klucz · " + (ch + 1) + ". " + name(ch);

        function render() {
          $("text").replaceChildren(text(ch));
          $("words-title").textContent = wordsTitle(ch);
          $("words").replaceChildren(words(ch));

          $("chapter").value = ch;
          $("prev").disabled = ch === 0;
          $("next").disabled = ch === CH.length - 1;
          $("german").hidden = !CH[ch].de;
          $("prev").title =
            ch === 0 ? "Das ist das erste Kapitel" : "Rozdział " + ch + ": " + name(ch - 1);
          $("next").title =
            ch === CH.length - 1
              ? "Das ist das letzte Kapitel"
              : "Rozdział " + (ch + 2) + ": " + name(ch + 1);
          copyButtons();
          document.title = pageTitle();
        }

        function go(i, p = 0) {
          if (i < 0 || i >= CH.length) return;
          if (i !== ch) {
            ch = i;
            closePop();
            render();
          }
          scrollToBlock(p);
          save();
        }

        // reading position: the top block of the article under the bar, kept in the hash (#r5/12) and in localStorage
        const KEY = "klucz-position";
        const barBottom = () => document.querySelector(".bar").getBoundingClientRect().bottom;
        let saveTimer;
        function scrollToBlock(p) {
          const b = $("text").children[p];
          window.scrollTo(
            0,
            p && b ? b.getBoundingClientRect().top + window.scrollY - barBottom() - 16 : 0,
          );
        }
        function save() {
          const blocks = $("text").children,
            top = barBottom() + 24;
          let p = 0;
          while (p + 1 < blocks.length && blocks[p + 1].getBoundingClientRect().top <= top) p++;
          try {
            history.replaceState(null, "", "#r" + (ch + 1) + (p ? "/" + p : ""));
          } catch {}
          try {
            localStorage.setItem(KEY, JSON.stringify([ch, p]));
          } catch {}
        }
        window.addEventListener(
          "scroll",
          () => {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(save, 200);
          },
          { passive: true },
        );

        // tap a word: lemma, tag and translation
        function openPop(w) {
          closePop();
          active = w;
          w.classList.add("active");
          const [lemma, tag, de] = W[w.dataset.i];
          const pop = $("pop");
          pop.textContent = "";
          const close = el("button", "close"); // shown only on the bottom sheet
          close.setAttribute("aria-label", "Schließen");
          close.append(icon("close"));
          close.onclick = closePop;
          pop.append(close);
          if (w.textContent.toLowerCase() !== lemma) {
            const f = el("span", "form", w.textContent);
            f.append(icon("arrow_forward"));
            pop.append(f);
          }
          pop.append(el("b", "", lemma));
          if (tag) pop.append(el("i", "", tag));
          pop.append(el("p", "", de));
          if (window.speechSynthesis) {
            const say = el("button", "say");
            say.setAttribute("aria-label", "Aussprechen");
            say.append(icon("volume_up"));
            say.onclick = () => speak(lemma);
            pop.append(say);
          }
          pop.hidden = false;
          if (matchMedia("(min-width: 641px)").matches) {
            const r = w.getBoundingClientRect();
            const width = pop.offsetWidth;
            const left = Math.max(
              16,
              Math.min(
                r.left + r.width / 2 - width / 2,
                document.documentElement.clientWidth - width - 16,
              ),
            );
            const below = r.bottom + pop.offsetHeight + 16 <= window.innerHeight;
            pop.style.left = left + window.scrollX + "px";
            pop.style.top =
              (below ? r.bottom + 8 : r.top - pop.offsetHeight - 8) + window.scrollY + "px";
          }
        }
        // the device's own Polish voice, if it has one
        function speak(text) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "pl-PL";
          u.voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith("pl")) || null;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        }
        function closePop() {
          $("pop").hidden = true;
          if (active) active.classList.remove("active");
          active = null;
        }
        $("text").addEventListener("click", (e) => {
          const w = e.target.closest(".w");
          if (!w) return;
          e.stopPropagation();
          w === active ? closePop() : openPop(w);
        });
        document.addEventListener("click", (e) => {
          if (!e.target.closest("#pop")) closePop();
        });

        // the whole chapter, and if it is longer than the 5,000 characters Google Translate accepts, its parts
        function copyButtons() {
          const row = $("copy"),
            parts = CH[ch].parts;
          const whole = button(parts.join("\n\n"), "Kapitel", "Alles");
          const each =
            parts.length > 1
              ? parts.map((text, i) =>
                  button(
                    text,
                    "Teil " + (i + 1) + " von " + parts.length,
                    el("span", "long", "Teil "),
                    i + 1,
                  ),
                )
              : [];
          row.replaceChildren(whole, ...each);
        }
        function button(text, done, ...label) {
          const b = el("button");
          b.append(icon("content_copy"), ...label);
          b.title = text.length.toLocaleString("de-DE") + " Zeichen";
          b.onclick = () => copy(text, b, done);
          return b;
        }
        function toast(msg, then) {
          const t = $("toast");
          t.textContent = msg;
          t.hidden = false;
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            t.hidden = true;
            then?.();
          }, 3500);
        }
        async function copy(text, button, label) {
          let ok = false;
          try {
            await navigator.clipboard.writeText(text);
            ok = true;
          } catch {
            const ta = $("fallback");
            ta.value = text;
            ta.select();
            try {
              ok = document.execCommand("copy");
            } catch {}
          }
          const mark = (b, done) => {
            b.classList.toggle("done", done);
            b.querySelector(".icon").textContent = done ? "check" : "content_copy";
          };
          $("copy")
            .querySelectorAll("button")
            .forEach((b) => mark(b, ok && b === button));
          if (!ok) {
            toast("Kopieren ist in diesem Browser blockiert.");
            return;
          }
          toast(label + " kopiert.", () => mark(button, false)); // the button turns back when the message goes
        }

        $("to-words").onclick = () => {
          const top =
            $("words-title").getBoundingClientRect().top +
            window.scrollY -
            document.querySelector(".bar").offsetHeight -
            24;
          window.scrollTo({ top, behavior: "smooth" });
        };
        // every chapter with its words, each starting on a new page; built only while printing
        $("print").onclick = () => {
          $("book").replaceChildren(
            ...CH.map((_, i) => {
              const art = el("article"),
                list = el("dl", "words"),
                sec = el("section"),
                page = el("div");
              art.append(text(i));
              list.append(words(i));
              sec.append(el("h2", "", wordsTitle(i)), list);
              page.append(art, sec);
              return page;
            }),
          );
          document.documentElement.classList.add("print-all");
          document.title = "Klucz"; // also the file name when saved as PDF
          window.print();
        };
        window.addEventListener("afterprint", () => {
          document.documentElement.classList.remove("print-all");
          $("book").replaceChildren();
          document.title = pageTitle();
        });
        // the button names the language it switches to
        $("german").onclick = (e) => {
          closePop();
          const on = document.documentElement.classList.toggle("german");
          e.currentTarget.textContent = on ? "PL" : "DE";
          e.currentTarget.title = on ? "Polnisch zeigen" : "Deutsch zeigen";
        };
        $("prev").onclick = () => go(ch - 1);
        $("next").onclick = () => go(ch + 1);
        $("chapter").onchange = (e) => {
          go(+e.target.value);
          e.target.blur();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closePop();
          if (e.target.closest("select")) return;
          if (e.key === "ArrowLeft") go(ch - 1);
          if (e.key === "ArrowRight") go(ch + 1);
        });
        const clamp = (i) => Math.min(Math.max(i, 0), CH.length - 1);
        const fromHash = () => {
          const m = location.hash.match(/^#r(\d+)(?:\/(\d+))?$/);
          return m && [clamp(+m[1] - 1), +(m[2] || 0)];
        };
        const stored = () => {
          try {
            const [c, p] = JSON.parse(localStorage.getItem(KEY));
            return [clamp(c), p];
          } catch {}
        };
        window.addEventListener("hashchange", () => go(...(fromHash() || [0, 0])));
        const saved = !fromHash() && stored();
        const [c, p] = fromHash() || saved || [0, 0];
        ch = c;
        render();
        history.scrollRestoration = "manual"; // on reload the browser would scroll to the old offset after our jump
        document.fonts.ready.then(() => go(c, p)); // the layout settles once the fonts are in
        if (saved && (c || p)) toast("Weiterlesen: Kapitel " + (c + 1));
      })();
    </script>
  </body>
</html>
